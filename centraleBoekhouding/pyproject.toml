[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centrale-boekhouding"
version = "0.1"
description = "Central lock + selected-file sync for lokaleBoekhouding workspaces"
readme = "readme.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.6.0",
]

[project.scripts]
centrale-boekhouding = "app.main:run"

[dependency-groups]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
