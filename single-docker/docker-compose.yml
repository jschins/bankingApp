services:
  single-docker:
    build:
      context: ..
      dockerfile: single-docker/Dockerfile
    image: bankingApp-single-docker:latest
    container_name: bankingApp-single-docker
    restart: unless-stopped
    ports:
      - "${PORT:-8200}:8200"
    volumes:
      - ./data:/app/data
      - ./secret:/app/secret:ro
